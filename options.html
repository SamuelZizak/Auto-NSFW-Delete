<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Auto History Cleaner</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; min-width: 340px; max-width: 520px; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    label.row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
    textarea { width: 100%; box-sizing: border-box; min-height: 70px; font-family: monospace; }
    .hint { color: #666; font-size: 12px; margin: 2px 0 8px; }
    button { margin-top: 8px; padding: 6px 12px; }
    #status { margin-top: 10px; font-size: 13px; color: #070; min-height: 18px; }
  </style>
</head>
<body>
  <h1>Auto History Cleaner</h1>

  <label class="row"><input type="checkbox" id="enabled"> Enabled</label>
  <label class="row"><input type="checkbox" id="deleteGoogleSearches"> Delete Google searches</label>
  <label class="row"><input type="checkbox" id="deleteNsfw"> Delete NSFW pages</label>
  <label class="row"><input type="checkbox" id="sweepOnStartup"> Clean existing history on browser start</label>

  <p><strong>Extra keywords</strong></p>
  <textarea id="customKeywords" placeholder="one per line"></textarea>
  <div class="hint">Matched against the address and page title.</div>

  <p><strong>Extra domains</strong></p>
  <textarea id="customDomains" placeholder="example.com (one per line)"></textarea>
  <div class="hint">Subdomains are included automatically.</div>

  <button id="save">Save</button>
  <button id="sweep">Clean existing history now</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
